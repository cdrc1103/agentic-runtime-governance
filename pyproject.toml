[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arg"]

[project]
name = "agentic-runtime-governance"
version = "0.1.0"
description = "Unofficial, independent reference implementation based on the SAFR white paper (runtime governance for agentic finance). Demo only; not regulatory guidance."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.2",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "rfc8785>=0.1.4",
]

[project.optional-dependencies]
service = [
    "fastapi>=0.143.0",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "uvicorn>=0.54.0",
]
gateway = [
    "httpx2>=2.13.1",
    "starlette>=1.8.0",
]

[dependency-groups]
dev = [
    "ruff>=0.1.9",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pre-commit>=3.6.0",
    "mypy>=2.4.0",
    "types-pyyaml",
    "pip-audit>=2.10.1",
    "hypothesis>=6.169.0",
    "httpx2>=2.13.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "ARG", # flake8-unused-arguments
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG"]  # test doubles implement abstract signatures
"tests/conformance/*.py" = ["N802"]  # test_S01_… mirrors scenario IDs
"src/arg/gateway/*.py" = ["ARG002"]  # renderers share one abstract signature
"*.ipynb" = [
    "I",     # isort (import sorting)
    "E401",  # multiple imports on one line
    "E402",  # module level import not at top of file
    "F401",  # imported but unused
    "B905",  # zip() without strict= parameter
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --cov=src/arg/core --cov-report=term-missing"
markers = [
    "scenario(id): conformance scenario ID (conformance/scenarios.md)",
    "rego: needs the opa binary on PATH; skipped when absent",
    "req(id): requirement ID covered by the test (see docs/spec/requirements.md)",
]

[tool.coverage.run]
source = ["src/arg/core"]
omit = ["tests/*", "**/__pycache__/*"]

[tool.coverage.report]
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.mypy]
strict = true
disable_error_code = ["type-abstract"]  # registries take abstract classes by design
python_version = "3.12"
files = ["src", "tests", "scripts", "demo"]
