# Sample composition. Implementations arrive phase by phase (docs/plan/phases.md);
# until then this file lists the intended wiring and `build_runtime` rejects unknown types.
components:
  state_store: {type: memory}            # Phase 6
  audit_store: {type: memory}            # Phase 5
  anchor_sink: {type: file, path: var/anchors.jsonl}
  agent_registry: {type: file, path: config/agents.yaml}   # Phase 2
  identity_verifier: {type: default}
  controls_repository: {type: bundle, path: config/controls}  # Phase 3
  resolution_policy: {type: precedence}  # Phase 4
  token_service: {type: ed25519}         # Phase 7
evaluators:
  authorisation: {type: authorisation}
  exposure: {type: exposure}
pipeline: [validate, identity, retrieve, evaluate, reserve, audit]
